<!doctype html><html><head><meta charset="utf-8"><style>.lfs-dialog { width: min(1380px, 96vw); max-width: 96vw; height: min(880px, 92vh); max-height: 92vh; padding: 0; margin: auto; border: 1px solid #d8deea; border-radius: 16px; background: #fff; color: #172033; box-shadow: 0 24px 90px #0f172a40; overflow: hidden; font: 14px/1.5 system-ui, sans-serif; }
.lfs-dialog[open] { display: flex; flex-direction: column; }
.lfs-dialog::backdrop { background: #0f172a66; backdrop-filter: blur(3px); }
.lfs-dialog *, .lfs-dialog *::before, .lfs-dialog *::after { box-sizing: border-box; }
.lfs-dialog [hidden] { display: none !important; }
.lfs-dialog svg { width: 18px; height: 18px; flex-shrink: 0; }
.lfs-dialog button { cursor: pointer; font: inherit; }
.lfs-dialog button:disabled { opacity: .45; cursor: not-allowed; }
.lfs-dialog button:focus-visible, .lfs-dialog input:focus-visible { outline: 2px solid #7c3aed; outline-offset: 3px; }
.lfs-header { display: flex; align-items: center; gap: 14px; padding: 20px 24px; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
.lfs-heading-icon { display: grid; place-items: center; width: 44px; height: 44px; background: #ede9fe; border-radius: 12px; color: #7c3aed; flex-shrink: 0; }
.lfs-heading-icon svg { width: 24px; height: 24px; }
.lfs-heading { flex: 1; min-width: 0; }
.lfs-heading h2 { font-size: 19px; font-weight: 700; margin: 0 0 3px; }
.lfs-heading p { margin: 0; color: #64748b; font-size: 13px; }
.lfs-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); flex: 1; min-height: 0; }
.lfs-sidebar { padding: 20px 16px; background: #f8fafc; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; min-height: 0; gap: 12px; }
.lfs-source-label { display: flex; gap: 8px; align-items: center; font-weight: 650; color: #334155; }
.lfs-source-label svg { color: #7c3aed; }
.lfs-folder { font-size: 12px; color: #64748b; overflow-wrap: anywhere; margin: 0; max-height: 90px; overflow: auto; }
.lfs-button, .lfs-icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border: 1px solid #d8deea; border-radius: 8px; background: #fff; color: #334155; font-weight: 600 !important; }
.lfs-icon-button { width: 36px; height: 36px; padding: 7px; flex-shrink: 0; }
.lfs-button:hover:not(:disabled), .lfs-icon-button:hover:not(:disabled) { background: #f1f5f9; border-color: #a8b4c5; }
.lfs-navigation .lfs-button { font-size: 12px; padding: 6px 10px; }
.lfs-search { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #fff; border: 1px solid #d8deea; border-radius: 8px; color: #94a3b8; }
.lfs-search input { width: 100%; min-width: 0; border: 0; background: transparent; padding: 2px; font: inherit; color: #172033; box-shadow: none; }
.lfs-count { margin: 0; color: #64748b; font-size: 12px; }
.lfs-entries { flex: 1; overflow: auto; min-height: 80px; }
.lfs-entry { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 10px; margin-bottom: 6px; background: #fff; border: 1px solid #e2e8f0; border-radius: 9px; color: #475569; }
.lfs-entry span { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 12px; }
.lfs-entry svg:last-child { width: 15px; }
.lfs-entry[aria-pressed="false"] svg:last-child { visibility: hidden; }
.lfs-entry:hover { border-color: #c4b5fd; background: #faf5ff; }
.lfs-entry.is-selected { border-color: #8b5cf6; background: #ede9fe; color: #5b21b6; box-shadow: 0 0 0 1px #8b5cf6; }
.lfs-source-note, .lfs-empty { color: #64748b; font-size: 12px; margin: 0; }
.lfs-source-note { border-top: 1px solid #e2e8f0; padding-top: 12px; }
.lfs-workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #f1f5f9; }
.lfs-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 20px; background: #fff; border-bottom: 1px solid #e2e8f0; }
.lfs-file-info { min-width: 0; }
.lfs-file-info strong { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
.lfs-file-info span { display: block; font-size: 12px; color: #64748b; margin-top: 3px; }
.lfs-zoom-controls { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.lfs-zoom-controls .lfs-button { padding: 7px 10px; font-size: 12px; }
.lfs-zoom-value { min-width: 44px; text-align: center; font-size: 12px; color: #475569; font-variant-numeric: tabular-nums; }
.lfs-previews { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 18px; min-height: 0; }
.lfs-previews.lfs-comparison { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.lfs-pane { margin: 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; border: 1px solid #d8deea; border-radius: 10px; overflow: hidden; background: #e8edf3; }
.lfs-pane figcaption { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #fff; border-bottom: 1px solid #d8deea; font-size: 12px; font-weight: 600; }
.lfs-pane figcaption span { color: #7c3aed; font-size: 11px; background: #f5f3ff; border-radius: 4px; padding: 2px 6px; }
.lfs-canvas { flex: 1; min-height: 0; overflow: auto; padding: 20px; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 16px 16px; }
.lfs-canvas img { display: block; max-width: none; margin: 0 auto; background: #fff; box-shadow: 0 4px 18px #0f172a26; }
.lfs-placeholder { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; color: #64748b; font-size: 13px; }
.lfs-placeholder svg { width: 44px; height: 44px; color: #a78bfa; }
.lfs-placeholder strong { color: #334155; font-size: 15px; }
.lfs-placeholder span { max-width: 260px; }
.lfs-preview-hint { display: flex; align-items: center; justify-content: center; gap: 7px; margin: 0; padding: 0 16px 14px; font-size: 12px; color: #64748b; }
.lfs-preview-hint svg { width: 14px; height: 14px; }
.lfs-footer { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 24px; border-top: 1px solid #e2e8f0; background: #fff; }
.lfs-footer-message { font-size: 12px; color: #64748b; }
.lfs-footer-message p { margin: 0; color: #b91c1c; }
.lfs-footer-message p:empty { display: none; }
.lfs-footer-actions { display: flex; gap: 10px; flex-shrink: 0; }
.lfs-confirm { background: #7c3aed; border-color: #7c3aed; color: #fff; }
.lfs-confirm:hover:not(:disabled) { background: #6d28d9; border-color: #6d28d9; }
@media (max-width: 900px) {
  .lfs-layout { grid-template-columns: 220px minmax(0, 1fr); }
  .lfs-toolbar { flex-wrap: wrap; gap: 10px; }
  .lfs-header, .lfs-footer { padding: 14px 16px; }
  .lfs-previews { padding: 10px; gap: 8px; }
  .lfs-pane figcaption { flex-wrap: wrap; }
}
@media (max-width: 640px) {
  .lfs-dialog { height: 94vh; max-height: 94vh; }
  .lfs-layout { display: flex; flex-direction: column; overflow: auto; }
  .lfs-sidebar { flex: 0 0 220px; border-right: 0; border-bottom: 1px solid #e2e8f0; padding: 12px; gap: 8px; }
  .lfs-folder, .lfs-source-note { display: none; }
  .lfs-workspace { flex: 1 0 440px; }
  .lfs-footer { flex-wrap: wrap; gap: 10px; }
  .lfs-footer-actions { margin-left: auto; }
  .lfs-heading h2 { font-size: 16px; }
  .lfs-heading p { display: none; }
}

es. */
window.LargeFormatScans = (() => {
    async function json(url, options = {}) {
        const response = await fetch(url, { ...options, headers: {
            Accept: 'application/json', 'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.content || '',
            ...options.headers
        }});
        const result = await response.json();
        if (!response.ok) throw new Error(Object.values(result.errors || {}).flat().join(' ') || result.message || 'LF request failed.');
        return result;
    }
    function save(payload) {
        return json(window.largeFormatConfig.save, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    }
    async function file(entry) {
        const response = await fetch(entry.url, { headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error('The LF image could not be loaded.');
        const blob = await response.blob();
        return new File([blob], entry.name, { type: blob.type });
    }
    function open({ existingUrl = '', title = 'Browse Large-Format Scans', confirmLabel = 'Add LF Scan', onConfirm }) {
        const paths = {
            'scan-line': '<path d="M4 7V4h3m10 0h3v3M4 17v3h3m10 0h3v-3M4 12h16"/>',
            x: '<path d="m6 6 12 12M6 18 18 6"/>',
            'folder-open': '<path d="M3 8V5h6l2 3h10l-3 12H3V8Zm0 4h17"/>',
            folder: '<path d="M3 20V5h6l2 3h10v12Z"/>',
            'arrow-up': '<path d="M12 20V4m-6 6 6-6 6 6"/>',
            search: '<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',
            'zoom-in': '<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M7 10h6m-3-3v6"/>',
            'zoom-out': '<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M7 10h6"/>',
            maximize: '<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>',
            image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1"/><path d="m3 17 6-6 4 4 3-3 5 5"/>',
            'file-image': '<path d="M14 2H4v20h16V8Zm0 0v6h6M6 18l4-4 3 3 2-2 3 3"/>',
            'mouse-pointer-2': '<path d="m4 3 7 18 3-7 7-3Z"/>',
            check: '<path d="m5 12 4 4L19 6"/>',
            'chevron-right': '<path d="m9 5 7 7-7 7"/>'
        };
        const icon = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.image}</svg>`;
        const dialog = document.createElement('dialog');
        dialog.className = 'lfs-dialog';
        dialog.setAttribute('aria-label', title);
        dialog.innerHTML = `
            <header class="lfs-header">
                <div class="lfs-heading-icon">${icon('scan-line')}</div>
                <div class="lfs-heading"><h2></h2><p>Choose an image and check the details before confirming.</p></div>
                <button type="button" class="lfs-icon-button" data-close aria-label="Close browser">${icon('x')}</button>
            </header>
            <div class="lfs-layout">
                <aside class="lfs-sidebar">
                    <div class="lfs-source-label">${icon('folder-open')} Master LFS Folder</div>
                    <p data-folder class="lfs-folder">Loading folder...</p>
                    <div class="lfs-navigation"><button type="button" data-up class="lfs-button" disabled>${icon('arrow-up')} Up one folder</button></div>
                    <label class="lfs-search">${icon('search')}<input aria-label="Filter LF images" placeholder="Search this folder"></label>
                    <p data-count class="lfs-count" aria-live="polite"></p>
                    <div data-entries class="lfs-entries" aria-label="Folder contents"></div>
                    <p class="lfs-source-note">JPG, PNG, WebP, GIF or BMP<br>The original stays in this folder.</p>
                </aside>
                <section class="lfs-workspace" aria-label="Image preview">
                    <div class="lfs-toolbar">
                        <div class="lfs-file-info"><strong data-filename>No image selected</strong><span data-dimensions>Select a file from the list to preview it.</span></div>
                        <div class="lfs-zoom-controls">
                            <button type="button" class="lfs-icon-button" data-minus aria-label="Zoom out" disabled>${icon('zoom-out')}</button>
                            <span data-zoom class="lfs-zoom-value">Fit</span>
                            <button type="button" class="lfs-icon-button" data-plus aria-label="Zoom in" disabled>${icon('zoom-in')}</button>
                            <button type="button" class="lfs-button" data-fit disabled>${icon('maximize')} Fit</button>
                        </div>
                    </div>
                    <div class="lfs-previews">
                        <figure data-old class="lfs-pane"><figcaption>Current page <span>Before replacement</span></figcaption><div class="lfs-canvas"><img alt="Current page"><p class="lfs-placeholder" data-old-error hidden>Current image preview is unavailable.</p></div></figure>
                        <figure class="lfs-pane"><figcaption>Large-format scan <span data-selected-badge>Preview</span></figcaption><div class="lfs-canvas" data-canvas><img data-new alt="Selected large-format scan" hidden><div data-placeholder class="lfs-placeholder">${icon('image')}<strong>Select a scan to preview</strong><span>Your image will appear here at full available width.</span></div></div></figure>
                    </div>
                    <p class="lfs-preview-hint">${icon('mouse-pointer-2')} Zoom in to inspect fine details. Scroll the image to explore it.</p>
                </section>
            </div>
            <footer class="lfs-footer"><div class="lfs-footer-message"><p data-error role="alert"></p><span data-help></span></div><div class="lfs-footer-actions"><button type="button" class="lfs-button" data-cancel>Cancel</button><button type="button" class="lfs-button lfs-confirm" data-confirm disabled>${icon('check')}<span></span></button></div></footer>`;
        const find = selector => dialog.querySelector(selector);
        find('h2').textContent = title;
        find('[data-help]').textContent = existingUrl ? 'Compare both images, then confirm the replacement.' : 'Nothing is added until you confirm your selection.';
        find('[data-confirm] span').textContent = confirmLabel;
        const old = find('[data-old]');
        const oldImage = old.querySelector('img');
        if (!existingUrl) old.remove();
        else find('.lfs-previews').classList.add('lfs-comparison');
        const error = find('[data-error]');
        const confirm = find('[data-confirm]');
        const preview = find('[data-new]');
        const placeholder = find('[data-placeholder]');
        let currentPath = '', entries = [], selected = null, busy = false, generation = 0, imageGeneration = 0;
        let zoom = 1, ready = false;
        const zoomButtons = ['[data-minus]', '[data-plus]', '[data-fit]'].map(find);
        function resizeImages() {
            dialog.querySelectorAll('.lfs-canvas img').forEach(img => {
                if (!img.naturalWidth || img.hidden) return;
                const canvas = img.parentElement;
                const fit = Math.min((canvas.clientWidth - 40) / img.naturalWidth, (canvas.clientHeight - 40) / img.naturalHeight, 1);
                img.style.width = `${Math.max(1, Math.round(img.naturalWidth * fit * zoom))}px`;
                img.style.height = 'auto';
            });
            find('[data-zoom]').textContent = zoom === 1 ? 'Fit' : `${Math.round(zoom * 100)}%`;
            zoomButtons[0].disabled = !ready || zoom <= 0.5;
            zoomButtons[1].disabled = !ready || zoom >= 5;
            zoomButtons[2].disabled = !ready;
        }
        const observer = new ResizeObserver(resizeImages);
        const close = () => {
            if (busy) return;
            generation++; imageGeneration++; observer.disconnect(); dialog.close(); dialog.remove();
        };
        find('[data-cancel]').onclick = close;
        find('[data-close]').onclick = close;
        dialog.addEventListener('cancel', event => { event.preventDefault(); close(); });
        function resetPreview(message = 'Select a scan to preview') {
            ready = false; selected = null; zoom = 1; imageGeneration++;
            confirm.disabled = true; preview.hidden = true; preview.removeAttribute('src');
            placeholder.hidden = false; placeholder.querySelector('strong').textContent = message;
            find('[data-filename]').textContent = 'No image selected';
            find('[data-dimensions]').textContent = 'Select a file from the list to preview it.';
            find('[data-selected-badge]').textContent = 'Preview';
            resizeImages();
        }
        function select(entry) {
            resetPreview('Loading image...');
            selected = entry;
            const token = ++imageGeneration;
            find('[data-filename]').textContent = entry.name;
            find('[data-filename]').title = entry.name;
            find('[data-dimensions]').textContent = 'Loading preview...';
            error.textContent = '';
            render();
            const loader = new Image();
            loader.onload = () => {
                if (token !== imageGeneration) return;
                preview.onload = resizeImages;
                preview.src = entry.url; preview.alt = entry.name; preview.hidden = false;
                placeholder.hidden = true; ready = true; confirm.disabled = busy;
                find('[data-dimensions]').textContent = `${loader.naturalWidth.toLocaleString()} x ${loader.naturalHeight.toLocaleString()} pixels`;
                find('[data-selected-badge]').textContent = 'Selected';
                find('[data-canvas]').scrollTo(0, 0);
                resizeImages();
            };
            loader.onerror = () => {
                if (token !== imageGeneration) return;
                error.textContent = 'This image could not be previewed. Select another scan or try again.';
                placeholder.querySelector('strong').textContent = 'Preview unavailable';
                find('[data-dimensions]').textContent = 'Unable to load image';
            };
            loader.src = entry.url;
        }
        function render() {
            const list = find('[data-entries]'); list.replaceChildren();
            const search = find('input').value.toLowerCase();
            const visible = entries.filter(entry => entry.name.toLowerCase().includes(search));
            find('[data-count]').textContent = `${visible.length} ${visible.length === 1 ? 'item' : 'items'}`;
            visible.forEach(entry => {
                const button = document.createElement('button');
                button.type = 'button'; button.className = 'lfs-entry';
                button.classList.toggle('is-selected', selected?.path === entry.path);
                if (!entry.directory) button.setAttribute('aria-pressed', String(selected?.path === entry.path));
                button.innerHTML = `${icon(entry.directory ? 'folder' : 'file-image')}<span></span>${icon(entry.directory ? 'chevron-right' : 'check')}`;
                button.querySelector('span').textContent = entry.name;
                button.title = entry.name;
                button.onclick = () => { if (!busy) entry.directory ? browse(entry.path) : select(entry); };
                list.append(button);
            });
            if (!visible.length) {
                const empty = document.createElement('p'); empty.className = 'lfs-empty';
                empty.textContent = search ? 'No files match your search.' : 'No supported images in this folder.';
                list.append(empty);
            }
        }
        async function browse(path) {
            const request = ++generation;
            resetPreview(); entries = []; render();
            find('[data-count]').textContent = 'Loading...';
            try {
                const url = new URL(window.largeFormatConfig.browse, location.href);
                url.searchParams.set('path', path);
                const result = await json(url);
                if (request !== generation) return;
                currentPath = result.path; entries = result.entries;
                find('[data-folder]').textContent = `${result.folder}${currentPath ? ' / ' + currentPath : ''}`;
                find('[data-up]').disabled = !currentPath;
                find('input').value = ''; error.textContent = ''; render();
            } catch (e) { if (request === generation) { error.textContent = e.message; find('[data-count]').textContent = 'Folder unavailable'; } }
        }
        find('[data-up]').onclick = () => { if (!busy) browse(currentPath.split('/').slice(0, -1).join('/')); };
        find('input').oninput = render;
        find('[data-plus]').onclick = () => { zoom = Math.min(5, zoom + 0.5); resizeImages(); };
        find('[data-minus]').onclick = () => { zoom = Math.max(0.5, zoom - 0.5); resizeImages(); };
        find('[data-fit]').onclick = () => { zoom = 1; resizeImages(); dialog.querySelectorAll('.lfs-canvas').forEach(canvas => canvas.scrollTo(0, 0)); };
        confirm.onclick = async () => {
            if (!selected || !ready || busy) return;
            busy = true; confirm.disabled = true; error.textContent = '';
            find('[data-confirm] span').textContent = 'Saving...';
            find('[data-cancel]').disabled = true; find('[data-close]').disabled = true;
            try { await onConfirm(selected); busy = false; close(); }
            catch (e) {
                error.textContent = e.message; busy = false; confirm.disabled = false;
                find('[data-confirm] span').textContent = confirmLabel;
                find('[data-cancel]').disabled = false; find('[data-close]').disabled = false;
            }
        };
        document.body.append(dialog); dialog.showModal();
        if (existingUrl) {
            oldImage.onload = resizeImages;
            oldImage.onerror = () => { oldImage.hidden = true; find('[data-old-error]').hidden = false; };
            oldImage.src = existingUrl;
        }
        observer.observe(find('.lfs-previews')); browse('');
    }
    return { open, save, file };
})();
</script><script>LargeFormatScans.open({onConfirm:async()=>{document.body.dataset.confirmed="yes"}});setTimeout(()=>document.querySelector(".lfs-entry").click(),100);</script><script>

document.querySelector('[data-plus]').click();
check(parseFloat(image.style.width)>before,'zoom enlarges preview');
document.querySelector('[data-fit]').click();
check(Math.abs(parseFloat(image.style.width)-before)<2,'fit restores image');
check(document.querySelector('.lfs-previews').children.length===1,'add uses full width');
const entry=Object.assign({},{});
const url=image.src;
document.querySelector('[data-cancel]').click();
LargeFormatScans.open({existingUrl:url,onConfirm:async()=>{}});
check(document.querySelectorAll('.lfs-pane').length===2,'replacement has two panes');
document.querySelector('.lfs-dialog').dataset.review='PASS: selection, zoom, fit, full width and comparison';
setTimeout(()=>document.querySelector('.lfs-entry').click(),50);
} catch(e){document.body.dataset.review='FAIL: '+e.message;}
},600);
</script></body></html>
