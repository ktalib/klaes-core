<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Type Selection Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Applicant Type Selection Test</h1>
        
        <!-- Enhanced Applicant Type Section -->
        <div class="col-span-3 mb-6">
          <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-lg p-5">
            <div class="flex items-center mb-4">
              <div class="flex-shrink-0">
                <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 515.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
              </div>
              <div class="ml-3">
                <h4 class="text-lg font-semibold text-gray-900">Applicant Type</h4>
                <p class="text-sm text-gray-600">Select the type of applicant for this application</p>
              </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <!-- Individual Option -->
              <label class="relative cursor-pointer group">
                <input type="radio" name="applicantType" class="sr-only peer" value="individual" onclick="setApplicantType('individual')">
                <div class="bg-white border-2 border-gray-200 rounded-lg p-4 transition-all duration-200 hover:border-blue-300 hover:shadow-md">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center">
                      <svg class="w-5 h-5 text-gray-600 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                      </svg>
                      <span class="ml-2 font-medium text-gray-900">Individual</span>
                    </div>
                    <div class="w-5 h-5 border-2 rounded-full flex items-center justify-center transition-all duration-200 border-gray-300">
                      <div class="w-2 h-2 bg-white rounded-full transition-opacity duration-200 opacity-0"></div>
                    </div>
                  </div>
                  <p class="text-xs text-gray-500 mt-2">Single person application</p>
                </div>
              </label>

              <!-- Corporate Option -->
              <label class="relative cursor-pointer group">
                <input type="radio" name="applicantType" class="sr-only peer" value="corporate" onclick="setApplicantType('corporate')">
                <div class="bg-white border-2 border-gray-200 rounded-lg p-4 transition-all duration-200 hover:border-blue-300 hover:shadow-md">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center">
                      <svg class="w-5 h-5 text-gray-600 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                      </svg>
                      <span class="ml-2 font-medium text-gray-900">Corporate</span>
                    </div>
                    <div class="w-5 h-5 border-2 rounded-full flex items-center justify-center transition-all duration-200 border-gray-300">
                      <div class="w-2 h-2 bg-white rounded-full transition-opacity duration-200 opacity-0"></div>
                    </div>
                  </div>
                  <p class="text-xs text-gray-500 mt-2">Company or organization</p>
                </div>
              </label>

              <!-- Multiple Owners Option -->
              <label class="relative cursor-pointer group">
                <input type="radio" name="applicantType" class="sr-only peer" value="multiple" onclick="setApplicantType('multiple')">
                <div class="bg-white border-2 border-gray-200 rounded-lg p-4 transition-all duration-200 hover:border-blue-300 hover:shadow-md">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center">
                      <svg class="w-5 h-5 text-gray-600 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 515.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                      </svg>
                      <span class="ml-2 font-medium text-gray-900">Multiple</span>
                    </div>
                    <div class="w-5 h-5 border-2 rounded-full flex items-center justify-center transition-all duration-200 border-gray-300">
                      <div class="w-2 h-2 bg-white rounded-full transition-opacity duration-200 opacity-0"></div>
                    </div>
                  </div>
                  <p class="text-xs text-gray-500 mt-2">Joint ownership application</p>
                </div>
              </label>
            </div>
            
            <!-- Selection Indicator -->
            <div class="mt-4 p-3 bg-white/70 rounded-md border border-blue-200" id="applicantTypeIndicator" style="display: none;">
              <div class="flex items-center text-sm">
                <svg class="w-4 h-4 text-green-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="text-gray-700">Selected: <span id="selectedApplicantType" class="font-medium text-blue-600"></span></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Debug Info -->
        <div class="mt-6 p-4 bg-white rounded-lg border">
            <h3 class="font-semibold mb-2">Debug Info:</h3>
            <p id="debugInfo">Click an applicant type to see selection feedback</p>
        </div>
    </div>

    <script>
        function setApplicantType(type) {
          // Update visual indicator
          const indicator = document.getElementById('applicantTypeIndicator');
          const selectedType = document.getElementById('selectedApplicantType');
          
          if (indicator && selectedType) {
            const typeLabels = {
              'individual': 'Individual Person',
              'corporate': 'Corporate Body',
              'multiple': 'Multiple Owners'
            };
            
            selectedType.textContent = typeLabels[type] || type;
            indicator.style.display = 'block';
            
            // Add a subtle animation
            indicator.style.opacity = '0';
            setTimeout(() => {
              indicator.style.opacity = '1';
            }, 100);
          }
          
          // Update visual selection states
          updateApplicantTypeVisuals(type);
          
          // Debug info
          document.getElementById('debugInfo').textContent = `Selected: ${type} - Visual update applied`;
        }

        function updateApplicantTypeVisuals(selectedType) {
          // Get all applicant type labels
          const labels = document.querySelectorAll('label[data-type]');
          
          labels.forEach(label => {
            const radio = label.querySelector('input[type="radio"]');
            const card = label.querySelector('.applicant-card') || label.querySelector('div');
            const circle = label.querySelector('.radio-circle') || label.querySelector('div.w-5.h-5');
            const dot = label.querySelector('.radio-dot') || circle?.querySelector('div.w-2.h-2');
            
            if (radio && radio.value === selectedType) {
              // Selected state
              if (card) {
                card.classList.remove('border-gray-200', 'bg-white');
                card.classList.add('border-blue-500', 'bg-blue-50', 'shadow-lg');
              }
              
              if (circle) {
                circle.classList.remove('border-gray-300');
                circle.classList.add('border-blue-500', 'bg-blue-500');
              }
              
              if (dot) {
                dot.classList.remove('opacity-0');
                dot.classList.add('opacity-100');
              }
              
              // Ensure radio is checked
              radio.checked = true;
            } else if (radio) {
              // Unselected state
              if (card) {
                card.classList.remove('border-blue-500', 'bg-blue-50', 'shadow-lg');
                card.classList.add('border-gray-200', 'bg-white');
              }
              
              if (circle) {
                circle.classList.remove('border-blue-500', 'bg-blue-500');
                circle.classList.add('border-gray-300');
              }
              
              if (dot) {
                dot.classList.remove('opacity-100');
                dot.classList.add('opacity-0');
              }
              
              // Ensure radio is unchecked
              radio.checked = false;
            }
          });
        }
    </script>
</body>
</html>
