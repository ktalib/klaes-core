<!DOCTYPE html>
<html>
<head>
    <title>Action Menu Test</title>
    <style>
        .action-dropdown {
            position: relative !important;
            display: inline-block;
            margin: 20px;
        }
        
        .action-toggle {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 0.375rem;
            padding: 0.375rem 0.75rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .action-toggle:hover {
            background: #e9ecef;
            border-color: #dee2e6;
        }
        
        .action-menu {
            position: absolute;
            top: 100%;
            right: 0;
            z-index: 1000;
            min-width: 200px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: none;
            margin-top: 0.25rem;
        }
        
        .action-menu.show {
            display: block !important;
        }
        
        .action-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #f1f3f4;
            color: #374151;
            text-decoration: none;
            transition: background-color 0.15s ease;
        }
        
        .action-item:hover {
            background: #f8f9fa;
            color: #374151;
        }
        
        .action-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h1>Action Menu Test</h1>
    <p>This is a simple test to verify the action menu functionality works correctly.</p>
    
    <div class="action-dropdown">
        <button type="button" class="action-toggle" onclick="toggleActionMenu(this, event)">
            ⚙️ Actions
        </button>
        <div class="action-menu">
            <a href="#" class="action-item" onclick="alert('View clicked'); return false;">
                👁️ View Application
            </a>
            <a href="#" class="action-item" onclick="alert('Upload clicked'); return false;">
                📤 Upload ST Memo
            </a>
            <a href="#" class="action-item" onclick="alert('View Memo clicked'); return false;">
                📄 View ST Memo
            </a>
        </div>
    </div>
    
    <div class="action-dropdown">
        <button type="button" class="action-toggle" onclick="toggleActionMenu(this, event)">
            ⚙️ Actions 2
        </button>
        <div class="action-menu">
            <a href="#" class="action-item" onclick="alert('Test 1'); return false;">
                🔧 Test Action 1
            </a>
            <a href="#" class="action-item" onclick="alert('Test 2'); return false;">
                🔨 Test Action 2
            </a>
        </div>
    </div>

    <script>
        function toggleActionMenu(button, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            
            console.log('Toggle action menu called', button);
            
            // Close all other menus first
            document.querySelectorAll('.action-menu').forEach(menu => {
                if (menu !== button.nextElementSibling) {
                    menu.classList.remove('show');
                }
            });
            
            // Toggle the clicked menu
            const menu = button.nextElementSibling;
            if (menu) {
                menu.classList.toggle('show');
                console.log('Menu toggled, show class:', menu.classList.contains('show'));
            } else {
                console.error('Menu element not found');
            }
        }
        
        // Close dropdowns when clicking outside
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.action-dropdown')) {
                document.querySelectorAll('.action-menu').forEach(menu => {
                    menu.classList.remove('show');
                });
            }
        });
        
        // Alternative event listener method
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.action-toggle').forEach(button => {
                button.addEventListener('click', function(e) {
                    console.log('Alternative event listener triggered');
                    // The onclick will handle it, this is just for backup
                });
            });
        });
    </script>
</body>
</html>
