<!DOCTYPE html>
<html>
<head>
    <title>File Upload Test - PrimaryApplicationController</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .file-input { margin: 10px 0; }
        button { padding: 10px 20px; margin: 10px 5px; }
        .results { margin-top: 20px; padding: 10px; background: #f5f5f5; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h2>File Upload Test - PrimaryApplicationController</h2>
    
    <form id="testForm" enctype="multipart/form-data">
        <div class="form-section">
            <h3>File Uploads</h3>
            
            <div class="file-input">
                <label><strong>Passport File:</strong></label><br>
                <input type="file" name="passport" id="passportInput" accept="image/*,.pdf">
                <span id="passportStatus"></span>
            </div>
            
            <div class="file-input">
                <label><strong>ID Document File:</strong></label><br>
                <input type="file" name="id_document" id="idDocumentInput" accept="image/*,.pdf">
                <span id="idDocumentStatus"></span>
            </div>
        </div>
        
        <div class="form-section">
            <h3>Required Fields (Hidden - Auto-filled for test)</h3>
            <input type="hidden" name="np_fileno" value="ST-COM-2025-TEST">
            <input type="hidden" name="fileno" value="TEST-COM-2025-001">
            <input type="hidden" name="land_use" value="COMMERCIAL">
            <input type="hidden" name="applicant_type" value="individual">
            <input type="hidden" name="first_name" value="TEST">
            <input type="hidden" name="surname" value="USER">
            <p><em>Auto-filled: np_fileno, fileno, land_use, applicant_type, first_name, surname</em></p>
        </div>
        
        <button type="button" onclick="testUpload()">Test Upload Both Files</button>
        <button type="button" onclick="checkFiles()">Check Selected Files</button>
        <button type="button" onclick="clearResults()">Clear Results</button>
    </form>
    
    <div id="results" class="results"></div>

    <script>
        function checkFiles() {
            const formData = new FormData(document.getElementById('testForm'));
            const results = document.getElementById('results');
            
            let output = '<h3>Selected Files:</h3>';
            
            for (let [key, value] of formData.entries()) {
                if (value instanceof File) {
                    output += `<strong>${key}:</strong> File "${value.name}" (${value.size} bytes, ${value.type})<br>`;
                } else if (key !== '_token') {
                    output += `<strong>${key}:</strong> ${value}<br>`;
                }
            }
            
            results.innerHTML = output;
        }
        
        function testUpload() {
            const formData = new FormData(document.getElementById('testForm'));
            const results = document.getElementById('results');
            
            // Add CSRF token
            formData.append('_token', document.querySelector('meta[name="csrf-token"]').getAttribute('content'));
            
            results.innerHTML = '<p>Uploading files...</p>';
            
            console.log('Sending form data...');
            for (let [key, value] of formData.entries()) {
                if (value instanceof File) {
                    console.log(`${key}: File "${value.name}" (${value.size} bytes)`);
                } else {
                    console.log(`${key}: ${value}`);
                }
            }
            
            fetch('/primaryform', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                console.log('Response:', data);
                let html = '<h3>Upload Result:</h3>';
                
                if (data.success) {
                    html += `<div class="success">
                        <p><strong>Success!</strong> ${data.message}</p>
                        <p><strong>Application ID:</strong> ${data.data.application_id}</p>
                        <p><strong>NP File No:</strong> ${data.data.np_fileno}</p>
                        <p><strong>File No:</strong> ${data.data.fileno}</p>
                    </div>`;
                } else {
                    html += `<div class="error">
                        <p><strong>Error:</strong> ${data.message}</p>
                        ${data.errors ? '<pre>' + JSON.stringify(data.errors, null, 2) + '</pre>' : ''}
                    </div>`;
                }
                
                results.innerHTML = html;
                
                // Check the database after successful upload
                if (data.success) {
                    setTimeout(() => checkDatabaseRecord(data.data.application_id), 1000);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                results.innerHTML = `<div class="error">
                    <h3>Upload Error:</h3>
                    <pre>${error.message}</pre>
                </div>`;
            });
        }
        
        function checkDatabaseRecord(applicationId) {
            fetch(`/api/check-file-uploads/${applicationId}`, {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                const results = document.getElementById('results');
                results.innerHTML += `
                    <h3>Database Verification:</h3>
                    <p><strong>Passport Path:</strong> ${data.passport || 'NULL'}</p>
                    <p><strong>ID Document Path:</strong> ${data.id_document || 'NULL'}</p>
                    <p><strong>Same Values?</strong> ${data.passport === data.id_document ? 'YES (PROBLEM!)' : 'NO (GOOD!)'}</p>
                `;
            })
            .catch(error => {
                console.log('Could not verify database record:', error);
            });
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Monitor file selections
        document.getElementById('passportInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            document.getElementById('passportStatus').textContent = 
                file ? `Selected: ${file.name} (${file.size} bytes)` : 'No file selected';
        });
        
        document.getElementById('idDocumentInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            document.getElementById('idDocumentStatus').textContent = 
                file ? `Selected: ${file.name} (${file.size} bytes)` : 'No file selected';
        });
    </script>
</body>
</html>
