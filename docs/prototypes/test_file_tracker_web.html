<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Tracker API Test</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; }
        .error { background-color: #f8d7da; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        .form-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 3px; box-sizing: border-box; }
        textarea { height: 100px; }
    </style>
</head>
<body>
    <h1>File Tracker API Test Page</h1>
    
    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    
    <div class="test-section">
        <h3>Create New File Tracker</h3>
        <form id="createForm">
            <div class="form-group">
                <label>File Number:</label>
                <input type="text" id="file_number" value="TEST-WEB-001">
            </div>
            <div class="form-group">
                <label>File Title:</label>
                <input type="text" id="file_title" value="Test Web File Tracker" required>
            </div>
            <div class="form-group">
                <label>File Type:</label>
                <input type="text" id="file_type" value="Application">
            </div>
            <div class="form-group">
                <label>Priority:</label>
                <select id="priority">
                    <option value="LOW">Low</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="HIGH">High</option>
                </select>
            </div>
            <div class="form-group">
                <label>Department:</label>
                <input type="text" id="department" value="IT Department" required>
            </div>
            <div class="form-group">
                <label>Description:</label>
                <textarea id="description">Test file tracker created from web interface</textarea>
            </div>
            <div class="form-group">
                <label>Deadline:</label>
                <input type="datetime-local" id="deadline" value="">
            </div>
            <div class="form-group">
                <label>Notes:</label>
                <textarea id="notes">Test notes for the file tracker</textarea>
            </div>
            <button type="button" onclick="createFileTracker()">Create File Tracker</button>
        </form>
        <div id="createResult"></div>
    </div>

    <div class="test-section">
        <h3>List File Trackers</h3>
        <button onclick="listFileTrackers()">Get All Trackers</button>
        <button onclick="getDashboard()">Get Dashboard Stats</button>
        <div id="listResult"></div>
    </div>

    <div class="test-section">
        <h3>Test Individual Tracker</h3>
        <div class="form-group">
            <label>Tracker ID:</label>
            <input type="number" id="trackerId" placeholder="Enter tracker ID">
        </div>
        <button onclick="getTracker()">Get Tracker</button>
        <button onclick="deleteTracker()">Delete Tracker</button>
        <div id="trackerResult"></div>
    </div>

    <script>
        // Set up axios defaults
        axios.defaults.headers.common['X-Requested-With'] = 'XMLHttpRequest';
        axios.defaults.headers.common['X-CSRF-TOKEN'] = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

        // Set deadline to one week from now
        document.addEventListener('DOMContentLoaded', function() {
            const deadline = new Date();
            deadline.setDate(deadline.getDate() + 7);
            document.getElementById('deadline').value = deadline.toISOString().slice(0, 16);
        });

        function showResult(elementId, data, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.className = 'test-section ' + (isSuccess ? 'success' : 'error');
            element.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        }

        async function createFileTracker() {
            try {
                const data = {
                    file_number: document.getElementById('file_number').value,
                    file_title: document.getElementById('file_title').value,
                    file_type: document.getElementById('file_type').value,
                    priority: document.getElementById('priority').value,
                    department: document.getElementById('department').value,
                    description: document.getElementById('description').value,
                    deadline: document.getElementById('deadline').value || null,
                    notes: document.getElementById('notes').value,
                    movement_log: [
                        {
                            office_code: 'OFF-001',
                            office_name: 'Reception',
                            log_in_time: '09:00',
                            log_in_date: new Date().toISOString().split('T')[0],
                            notes: 'Initial submission via web interface'
                        },
                        {
                            office_code: 'OFF-002',
                            office_name: 'Customer Care Unit',
                            log_in_time: '10:00',
                            log_in_date: new Date().toISOString().split('T')[0],
                            notes: 'For review and processing'
                        }
                    ]
                };

                const response = await axios.post('/api/file-trackers', data);
                showResult('createResult', response.data, true);
                
                // Update tracker ID field for testing
                if (response.data.data && response.data.data.id) {
                    document.getElementById('trackerId').value = response.data.data.id;
                }
            } catch (error) {
                showResult('createResult', error.response ? error.response.data : error.message, false);
            }
        }

        async function listFileTrackers() {
            try {
                const response = await axios.get('/api/file-trackers');
                showResult('listResult', response.data, true);
            } catch (error) {
                showResult('listResult', error.response ? error.response.data : error.message, false);
            }
        }

        async function getDashboard() {
            try {
                const response = await axios.get('/api/file-trackers/dashboard');
                showResult('listResult', response.data, true);
            } catch (error) {
                showResult('listResult', error.response ? error.response.data : error.message, false);
            }
        }

        async function getTracker() {
            const id = document.getElementById('trackerId').value;
            if (!id) {
                alert('Please enter a tracker ID');
                return;
            }

            try {
                const response = await axios.get(`/api/file-trackers/${id}`);
                showResult('trackerResult', response.data, true);
            } catch (error) {
                showResult('trackerResult', error.response ? error.response.data : error.message, false);
            }
        }

        async function deleteTracker() {
            const id = document.getElementById('trackerId').value;
            if (!id) {
                alert('Please enter a tracker ID');
                return;
            }

            if (!confirm('Are you sure you want to delete this tracker?')) {
                return;
            }

            try {
                const response = await axios.delete(`/api/file-trackers/${id}`);
                showResult('trackerResult', response.data, true);
            } catch (error) {
                showResult('trackerResult', error.response ? error.response.data : error.message, false);
            }
        }
    </script>
</body>
</html>
