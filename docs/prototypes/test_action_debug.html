<!DOCTYPE html>
<html>
<head>
    <title>Action Menu Debug Test</title>
    <style>
        .action-dropdown {
            position: relative;
            display: inline-block;
            margin: 20px;
        }
        
        .action-toggle {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.5rem;
            cursor: pointer;
        }
        
        .action-toggle:hover {
            background: #e5e7eb;
        }
        
        .action-menu {
            position: absolute;
            top: 100%;
            right: 0;
            z-index: 1000;
            min-width: 200px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-top: 0.25rem;
        }
        
        .action-menu.hidden {
            display: none;
        }
        
        .action-item {
            display: block;
            padding: 0.75rem 1rem;
            color: #374151;
            text-decoration: none;
            border-bottom: 1px solid #f3f4f6;
        }
        
        .action-item:hover {
            background: #f9fafb;
        }
        
        .action-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h1>Action Menu Debug Test</h1>
    <p>Test the inline onclick method:</p>
    
    <div class="action-dropdown">
        <button type="button" class="action-toggle" 
                onclick="
                    event.stopPropagation();
                    console.log('Inline button clicked!');
                    const menu = this.nextElementSibling;
                    const allMenus = document.querySelectorAll('.action-menu');
                    allMenus.forEach(m => { if(m !== menu) m.classList.add('hidden'); });
                    menu.classList.toggle('hidden');
                ">
            ⋯ Actions
        </button>
        <div class="action-menu hidden">
            <a href="#" class="action-item" onclick="alert('Action 1'); return false;">👁️ View Application</a>
            <a href="#" class="action-item" onclick="alert('Action 2'); return false;">📤 Upload Memo</a>
            <a href="#" class="action-item" onclick="alert('Action 3'); return false;">📄 View Memo</a>
        </div>
    </div>
    
    <div class="action-dropdown">
        <button type="button" class="action-toggle" onclick="testFunction(this, event)">
            🔧 Function Test
        </button>
        <div class="action-menu hidden">
            <a href="#" class="action-item" onclick="alert('Function Test 1'); return false;">🔨 Test 1</a>
            <a href="#" class="action-item" onclick="alert('Function Test 2'); return false;">⚡ Test 2</a>
        </div>
    </div>

    <script>
        function testFunction(button, event) {
            event.stopPropagation();
            console.log('Function method clicked!');
            const menu = button.nextElementSibling;
            const allMenus = document.querySelectorAll('.action-menu');
            allMenus.forEach(m => { if(m !== menu) m.classList.add('hidden'); });
            menu.classList.toggle('hidden');
        }
        
        // Close menus when clicking outside
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.action-dropdown')) {
                document.querySelectorAll('.action-menu').forEach(menu => {
                    menu.classList.add('hidden');
                });
            }
        });
    </script>
</body>
</html>
