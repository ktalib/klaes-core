<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Unit Data API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test Unit Data API</h1>
    
    <div>
        <label>Sub Application ID: <input type="number" id="subAppId" value="1" min="1"></label>
        <button onclick="testUnitDataAPI()">Test API</button>
        <button onclick="testDirectQuery()">Test Direct Query</button>
    </div>

    <div id="results"></div>

    <script>
        async function testUnitDataAPI() {
            const subAppId = document.getElementById('subAppId').value;
            
            if (!subAppId) {
                showResult('Please enter a Sub Application ID', 'error');
                return;
            }

            try {
                showResult('Testing API endpoint...', 'info');
                
                const response = await fetch(`/api/subapplication/${subAppId}/unit-data`, {
                    method: 'GET',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'Content-Type': 'application/json'
                    }
                });

                const responseText = await response.text();
                
                showResult(`<strong>Response Status:</strong> ${response.status}<br>
                           <strong>Response Body:</strong><pre>${responseText}</pre>`, 
                           response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    try {
                        const data = JSON.parse(responseText);
                        if (data.success && data.data) {
                            showResult(`<strong>✅ Unit Data Found:</strong><pre>${JSON.stringify(data.data, null, 2)}</pre>`, 'success');
                        } else {
                            showResult(`<strong>⚠️ API Response:</strong> ${data.message || 'Unknown error'}`, 'error');
                        }
                    } catch (e) {
                        showResult('Response is not valid JSON', 'error');
                    }
                }
                
            } catch (error) {
                showResult(`❌ Network Error: ${error.message}`, 'error');
                console.error('Error:', error);
            }
        }

        async function testDirectQuery() {
            showResult('Direct query test would need to be implemented in backend...', 'info');
        }

        function showResult(message, type) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        // Test on page load
        document.addEventListener('DOMContentLoaded', function() {
            showResult('Ready to test Unit Data API. Try Sub Application ID 1 first.', 'info');
        });
    </script>
</body>
</html>
