<!DOCTYPE html>
<html>
<head>
    <title>CSV Import Debug Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h2>CSV Import Debug Test</h2>
    
    <div>
        <input type="file" id="csvFile" accept=".csv">
        <button id="testImport">Test Import</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        document.getElementById('testImport').addEventListener('click', function() {
            const fileInput = document.getElementById('csvFile');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a CSV file');
                return;
            }
            
            console.log('Testing CSV file:', file.name);
            
            const formData = new FormData();
            formData.append('csv_file', file);
            formData.append('_token', 'test-token'); // This won't work without real CSRF token
            
            // Test the endpoint
            fetch('/primaryform/process-csv', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => {
                console.log('Response status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Response data:', data);
                document.getElementById('results').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Success!',
                        text: `Processed ${data.count} buyers`
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.message
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('results').innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            });
        });
    </script>
</body>
</html>
