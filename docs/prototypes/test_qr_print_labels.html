<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test QR Code Print Labels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #printSection, #printSection * { visibility: visible; }
            #printSection { 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 297mm; 
                height: 210mm; 
            }
            .print-30-in-1 {
                display: grid;
                grid-template-columns: repeat(3, 99mm);
                grid-auto-rows: 21mm;
                gap: 0mm;
                width: 297mm;
                height: 210mm;
                padding: 0;
                margin: 0;
            }
            .print-label {
                box-sizing: border-box;
                width: 99mm;
                height: 21mm;
                padding: 1.5mm;
                border: 0.3mm solid #333;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: white;
            }
        }
    </style>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Test QR Code Print Labels</h1>
        
        <div class="bg-white rounded-lg border p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Test QR Code Generation</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div class="border p-4 text-center">
                    <h3 class="font-medium mb-2">Test QR Code 1</h3>
                    <canvas id="qr1" width="120" height="120" class="mx-auto border"></canvas>
                    <p class="text-sm mt-2">FILE-2024-001</p>
                </div>
                
                <div class="border p-4 text-center">
                    <h3 class="font-medium mb-2">Test QR Code 2</h3>
                    <canvas id="qr2" width="120" height="120" class="mx-auto border"></canvas>
                    <p class="text-sm mt-2">FILE-2024-002</p>
                </div>
                
                <div class="border p-4 text-center">
                    <h3 class="font-medium mb-2">Test QR Code 3</h3>
                    <canvas id="qr3" width="120" height="120" class="mx-auto border"></canvas>
                    <p class="text-sm mt-2">FILE-2024-003</p>
                </div>
            </div>
            
            <div class="flex gap-4">
                <button 
                    id="generateBtn" 
                    class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
                >
                    Generate QR Codes
                </button>
                
                <button 
                    id="printBtn" 
                    class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700"
                >
                    Test Print
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden print section -->
    <div id="printSection" style="display: none;">
        <div class="print-30-in-1">
            <!-- Print labels will be generated here -->
        </div>
    </div>

    <script>
        document.getElementById('generateBtn').addEventListener('click', function() {
            console.log('Generating QR codes...');
            
            // Test data
            const testData = [
                { id: 'qr1', fileNumber: 'FILE-2024-001', shelf: 'A01', trackingId: 'TRK-001' },
                { id: 'qr2', fileNumber: 'FILE-2024-002', shelf: 'A02', trackingId: 'TRK-002' },
                { id: 'qr3', fileNumber: 'FILE-2024-003', shelf: 'A03', trackingId: 'TRK-003' }
            ];
            
            testData.forEach((data, index) => {
                setTimeout(() => {
                    const canvas = document.getElementById(data.id);
                    if (canvas && typeof QRious !== "undefined") {
                        try {
                            const qrData = JSON.stringify({
                                fileNumber: data.fileNumber,
                                shelf: data.shelf,
                                trackingId: data.trackingId,
                                timestamp: new Date().toISOString().split("T")[0],
                            });

                            console.log(`QR Data for ${data.fileNumber}:`, qrData);

                            const qr = new QRious({
                                element: canvas,
                                value: qrData,
                                size: 120,
                                level: "H",
                                background: "#ffffff",
                                foreground: "#000000",
                            });
                            
                            console.log(`QR code generated successfully for ${data.fileNumber}`);
                        } catch (error) {
                            console.error(`QR Code generation error for ${data.fileNumber}:`, error);
                        }
                    } else {
                        console.error("Canvas not found or QRious not loaded");
                    }
                }, index * 100);
            });
        });
        
        document.getElementById('printBtn').addEventListener('click', function() {
            console.log('Testing print functionality...');
            
            const printSection = document.getElementById("printSection");
            const printContainer = printSection.querySelector('.print-30-in-1');
            
            // Clear previous content
            printContainer.innerHTML = '';
            
            // Generate 6 test labels for printing
            for (let i = 0; i < 6; i++) {
                const fileNumber = `TEST-${(i + 1).toString().padStart(3, '0')}`;
                const location = `Shelf/Rack-A${(i + 1).toString().padStart(2, '0')}`;
                const trackingId = `TRK-${fileNumber}`;
                
                const labelDiv = document.createElement("div");
                labelDiv.className = "print-label";
                labelDiv.innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%;">
                        <canvas id="print-qr-${i}" width="60" height="60" style="margin-bottom: 2mm;"></canvas>
                        <div style="text-align: center;">
                            <p style="font-weight: bold; font-size: 8pt; margin: 0;">${fileNumber}</p>
                            <p style="font-size: 7pt; margin: 0;">${location}</p>
                        </div>
                    </div>
                `;
                
                printContainer.appendChild(labelDiv);
                
                // Generate QR code
                setTimeout(() => {
                    const canvas = document.getElementById(`print-qr-${i}`);
                    if (canvas && typeof QRious !== "undefined") {
                        try {
                            const qrData = JSON.stringify({
                                fileNumber: fileNumber,
                                shelf: location.replace("Shelf/Rack-", ""),
                                trackingId: trackingId,
                                timestamp: new Date().toISOString().split("T")[0],
                            });

                            const qr = new QRious({
                                element: canvas,
                                value: qrData,
                                size: 60,
                                level: "H",
                                background: "#ffffff",
                                foreground: "#000000",
                            });
                        } catch (error) {
                            console.error(`Print QR generation error:`, error);
                        }
                    }
                }, (i + 1) * 100);
            }
            
            // Trigger print after all QR codes are generated
            setTimeout(() => {
                window.print();
            }, 1000);
        });
        
        // Auto-generate QR codes on page load
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                document.getElementById('generateBtn').click();
            }, 500);
        });
    </script>
</body>
</html>
