<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo Upload Backend Test</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        #results { margin-top: 20px; padding: 10px; background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Memo Upload Backend Test</h1>
    
    <div class="test-section">
        <h3>1. Route Test</h3>
        <button onclick="testRoutes()">Test Routes Availability</button>
    </div>
    
    <div class="test-section">
        <h3>2. Database Table Test</h3>
        <button onclick="testDatabase()">Test Database Connection</button>
    </div>
    
    <div class="test-section">
        <h3>3. File Upload Test</h3>
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="testFile" accept=".pdf" required><br><br>
            <input type="number" id="applicationId" placeholder="Application ID" value="1" required><br><br>
            <input type="text" id="fileNo" placeholder="File Number" value="TEST-FILE-001" required><br><br>
            <textarea id="description" placeholder="Description (optional)"></textarea><br><br>
            <button type="button" onclick="testUpload()">Test Upload</button>
        </form>
    </div>
    
    <div id="results"></div>

    <script>
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = new Date().toLocaleTimeString() + ': ' + message;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }

        function testRoutes() {
            log('Testing route availability...', 'info');
            
            // Test if routes exist by making HEAD requests
            const routes = [
                '/programmes/upload-memo',
                '/programmes/download-memo/1'
            ];
            
            routes.forEach(route => {
                fetch(route, { method: 'HEAD' })
                    .then(response => {
                        if (response.status === 405) {
                            log(`✓ Route ${route} exists (Method Not Allowed expected for HEAD)`, 'success');
                        } else if (response.status === 404) {
                            log(`✗ Route ${route} not found`, 'error');
                        } else {
                            log(`✓ Route ${route} responds (Status: ${response.status})`, 'success');
                        }
                    })
                    .catch(error => {
                        log(`✗ Route ${route} error: ${error.message}`, 'error');
                    });
            });
        }

        function testDatabase() {
            log('Testing database connection...', 'info');
            
            // Simple test to see if we can reach the server
            fetch('/programmes/memo', { method: 'HEAD' })
                .then(response => {
                    if (response.ok || response.status === 405) {
                        log('✓ Database connection appears to be working', 'success');
                    } else {
                        log('✗ Database connection may have issues', 'error');
                    }
                })
                .catch(error => {
                    log(`✗ Database test error: ${error.message}`, 'error');
                });
        }

        function testUpload() {
            const fileInput = document.getElementById('testFile');
            const applicationId = document.getElementById('applicationId').value;
            const fileNo = document.getElementById('fileNo').value;
            const description = document.getElementById('description').value;
            
            if (!fileInput.files[0]) {
                log('✗ Please select a PDF file', 'error');
                return;
            }
            
            if (!applicationId || !fileNo) {
                log('✗ Please fill in Application ID and File Number', 'error');
                return;
            }
            
            log('Testing file upload...', 'info');
            
            const formData = new FormData();
            formData.append('memo_file', fileInput.files[0]);
            formData.append('application_id', applicationId);
            formData.append('file_no', fileNo);
            formData.append('description', description);
            formData.append('_token', document.querySelector('meta[name="csrf-token"]').getAttribute('content'));
            
            fetch('/programmes/upload-memo', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    log('✓ Upload successful: ' + data.message, 'success');
                    log('Upload ID: ' + data.data.upload_id, 'info');
                } else {
                    log('✗ Upload failed: ' + data.message, 'error');
                    if (data.errors) {
                        Object.values(data.errors).forEach(error => {
                            log('  - ' + error, 'error');
                        });
                    }
                }
            })
            .catch(error => {
                log('✗ Upload error: ' + error.message, 'error');
            });
        }

        // Auto-run route test on page load
        window.onload = function() {
            log('Backend test page loaded', 'info');
            testRoutes();
        };
    </script>
</body>
</html>
