<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serial Number Update Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold mb-6">Serial Number Update Test</h1>
        
        <!-- Test Serial Display -->
        <div class="mb-6 p-4 bg-blue-50 rounded-lg">
            <h3 class="font-semibold mb-3">Current Serial Number Display:</h3>
            <div class="flex justify-between items-center text-sm bg-gray-50 px-3 py-2 rounded">
                <span class="text-gray-600">Serial:</span>
                <span id="serial-number-display" class="font-semibold text-blue-700">1</span>
            </div>
        </div>
        
        <!-- Test NPFN Display -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">NPFN Display:</label>
            <input type="text" id="np-fileno-display" class="w-full p-3 border border-gray-300 rounded-lg bg-blue-50 font-mono" readonly value="ST-COM-2025-1">
        </div>
        
        <!-- Test Buttons -->
        <div class="space-y-3">
            <button onclick="testSerialUpdate('ST-COM-2025-5')" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                Test: Update to Serial 5 (Commercial)
            </button>
            <button onclick="testSerialUpdate('ST-RES-2025-12')" class="w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                Test: Update to Serial 12 (Residential)  
            </button>
            <button onclick="testSerialUpdate('ST-IND-2025-99')" class="w-full px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700">
                Test: Update to Serial 99 (Industrial)
            </button>
            <button onclick="testFallback()" class="w-full px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">
                Test: Fallback to 001
            </button>
        </div>
        
        <!-- Results -->
        <div class="mt-6 p-4 bg-gray-100 rounded-lg">
            <h3 class="font-semibold mb-2">Test Results:</h3>
            <div id="test-results" class="text-sm text-gray-700">
                Click a test button to see results...
            </div>
        </div>
    </div>

    <script>
        function testSerialUpdate(fileNumber) {
            console.log('Testing serial update with:', fileNumber);
            
            // Update NPFN display
            const npfnField = document.getElementById('np-fileno-display');
            if (npfnField) {
                npfnField.value = fileNumber;
            }
            
            // Extract and update the serial number display (same logic as file-modal-integration.js)
            const serialParts = fileNumber.split('-');
            if (serialParts.length >= 4) {
                const serialNumber = serialParts[3]; // ST-COM-2025-5 -> 5
                const serialDisplay = document.getElementById('serial-number-display');
                if (serialDisplay) {
                    serialDisplay.textContent = serialNumber;
                    console.log('Serial number updated to:', serialNumber);
                    
                    // Show results
                    document.getElementById('test-results').innerHTML = `
                        <div class="text-green-700">
                            ✅ <strong>Success!</strong><br>
                            File Number: <code class="bg-white px-2 py-1 rounded">${fileNumber}</code><br>
                            Extracted Serial: <code class="bg-white px-2 py-1 rounded">${serialNumber}</code><br>
                            Display Updated: Yes
                        </div>
                    `;
                } else {
                    document.getElementById('test-results').innerHTML = `
                        <div class="text-red-700">
                            ❌ <strong>Error!</strong><br>
                            Serial display element not found!
                        </div>
                    `;
                }
            } else {
                document.getElementById('test-results').innerHTML = `
                    <div class="text-red-700">
                        ❌ <strong>Error!</strong><br>
                        Invalid file number format: <code class="bg-white px-2 py-1 rounded">${fileNumber}</code>
                    </div>
                `;
            }
        }
        
        function testFallback() {
            console.log('Testing fallback serial update');
            
            // Update NPFN display with fallback
            const npfnField = document.getElementById('np-fileno-display');
            if (npfnField) {
                npfnField.value = 'ST-COM-2025-001';
            }
            
            // Update the serial number display with fallback value (same logic as file-modal-integration.js)
            const serialDisplay = document.getElementById('serial-number-display');
            if (serialDisplay) {
                serialDisplay.textContent = '001'; // Fallback serial
                console.log('Serial number fallback to: 001');
                
                // Show results
                document.getElementById('test-results').innerHTML = `
                    <div class="text-yellow-700">
                        ⚠️ <strong>Fallback Mode!</strong><br>
                        File Number: <code class="bg-white px-2 py-1 rounded">ST-COM-2025-001</code><br>
                        Fallback Serial: <code class="bg-white px-2 py-1 rounded">001</code><br>
                        Display Updated: Yes
                    </div>
                `;
            } else {
                document.getElementById('test-results').innerHTML = `
                    <div class="text-red-700">
                        ❌ <strong>Error!</strong><br>
                        Serial display element not found!
                    </div>
                `;
            }
        }
        
        // Test on page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Serial number test page loaded');
            console.log('Serial display element:', document.getElementById('serial-number-display'));
            
            document.getElementById('test-results').innerHTML = `
                <div class="text-blue-700">
                    📋 <strong>Ready for Testing!</strong><br>
                    Serial display element: ${document.getElementById('serial-number-display') ? '✅ Found' : '❌ Not Found'}<br>
                    NPFN display element: ${document.getElementById('np-fileno-display') ? '✅ Found' : '❌ Not Found'}
                </div>
            `;
        });
    </script>
</body>
</html>
