<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Indexed Files API with Shelf Location</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .test-results { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
    </style>
</head>
<body>
    <h1>Test Indexed Files API - Shelf Location Field</h1>
    
    <div id="test-results" class="test-results">
        <p>Testing API endpoint: <code>/fileindexing/api/indexed-files</code></p>
        <p>Status: <span id="status">Loading...</span></p>
    </div>
    
    <table id="results-table" style="display: none;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tracking ID</th>
                <th>Shelf Location</th>
                <th>File Number</th>
                <th>File Title</th>
                <th>Registry</th>
                <th>Batch No</th>
            </tr>
        </thead>
        <tbody id="results-body">
        </tbody>
    </table>

    <script>
        async function testAPI() {
            const statusElement = document.getElementById('status');
            const tableElement = document.getElementById('results-table');
            const bodyElement = document.getElementById('results-body');
            const testResultsDiv = document.getElementById('test-results');
            
            try {
                statusElement.textContent = 'Making API request...';
                
                const response = await fetch('/fileindexing/api/indexed-files?per_page=5', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (data.success && data.indexed_files) {
                    statusElement.textContent = `Success! Found ${data.indexed_files.length} files`;
                    testResultsDiv.className = 'test-results success';
                    
                    // Check if shelf_location field exists
                    let shelfLocationExists = false;
                    let shelfLocationCount = 0;
                    
                    data.indexed_files.forEach((file, index) => {
                        if (file.hasOwnProperty('shelf_location')) {
                            shelfLocationExists = true;
                            if (file.shelf_location && file.shelf_location !== null) {
                                shelfLocationCount++;
                            }
                        }
                        
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${file.id}</td>
                            <td>${file.tracking_id || '-'}</td>
                            <td>${file.shelf_location || 'NULL'}</td>
                            <td>${file.fileNumber || '-'}</td>
                            <td>${file.name || '-'}</td>
                            <td>${file.registry || '-'}</td>
                            <td>${file.batch_no || '-'}</td>
                        `;
                        bodyElement.appendChild(row);
                    });
                    
                    tableElement.style.display = 'table';
                    
                    // Update status with analysis
                    statusElement.innerHTML = `
                        ✅ API Response: SUCCESS<br>
                        ✅ Shelf Location Field: ${shelfLocationExists ? 'PRESENT' : 'MISSING'}<br>
                        📊 Files with shelf location data: ${shelfLocationCount}/${data.indexed_files.length}<br>
                        📋 Total files found: ${data.indexed_files.length}
                    `;
                    
                } else {
                    throw new Error('Invalid response format');
                }
                
            } catch (error) {
                statusElement.textContent = `Error: ${error.message}`;
                testResultsDiv.className = 'test-results error';
                console.error('API Test Error:', error);
            }
        }
        
        // Run test when page loads
        window.addEventListener('DOMContentLoaded', testAPI);
    </script>
</body>
</html>
