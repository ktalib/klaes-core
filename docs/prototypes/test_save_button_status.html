<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Button Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { border: 1px solid #ddd; padding: 15px; margin: 10px 0; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .btn-test { background: #007bff; color: white; border: none; }
    </style>
</head>
<body>
    <h1>JSI Modal Save Button Status Test</h1>
    
    <div class="test-section">
        <h3>Test Save Button Availability</h3>
        <button class="btn-test" onclick="testSaveButton()">Check Save Button Status</button>
        <div id="save-button-results"></div>
    </div>

    <div class="test-section">
        <h3>Debug Information</h3>
        <button class="btn-test" onclick="showModalInfo()">Show Modal Info</button>
        <div id="modal-info-results"></div>
    </div>

    <script>
        function testSaveButton() {
            const resultsDiv = document.getElementById('save-button-results');
            
            // Check if save button exists and its state
            const saveBtn = document.getElementById('jointInspectionSave');
            
            if (!saveBtn) {
                resultsDiv.innerHTML = '<div class="error">❌ Save button not found in DOM</div>';
                return;
            }

            let statusHtml = '<div class="success">✅ Save button found</div>';
            
            // Check if button is disabled
            if (saveBtn.disabled) {
                statusHtml += '<div class="error">❌ Save button is DISABLED</div>';
            } else {
                statusHtml += '<div class="success">✅ Save button is ENABLED</div>';
            }
            
            // Check button classes
            const classes = Array.from(saveBtn.classList);
            statusHtml += '<div class="info">Button classes: ' + classes.join(', ') + '</div>';
            
            // Check if it has proper styling for enabled state
            if (classes.includes('bg-blue-600') && !classes.includes('bg-gray-400')) {
                statusHtml += '<div class="success">✅ Save button has enabled styling</div>';
            } else if (classes.includes('bg-gray-400')) {
                statusHtml += '<div class="error">❌ Save button has disabled styling</div>';
            } else {
                statusHtml += '<div class="info">ℹ️ Save button styling is unclear</div>';
            }
            
            // Check button text
            statusHtml += '<div class="info">Button text: "' + saveBtn.textContent + '"</div>';
            
            resultsDiv.innerHTML = statusHtml;
        }

        function showModalInfo() {
            const resultsDiv = document.getElementById('modal-info-results');
            
            let infoHtml = '<h4>Modal Information:</h4>';
            
            // Check if modal exists
            const modal = document.getElementById('jointInspectionModal');
            if (modal) {
                infoHtml += '<div class="success">✅ Joint Inspection Modal found</div>';
                
                // Check modal visibility
                const isVisible = !modal.classList.contains('hidden');
                infoHtml += '<div class="info">Modal visible: ' + (isVisible ? 'Yes' : 'No') + '</div>';
            } else {
                infoHtml += '<div class="error">❌ Joint Inspection Modal not found</div>';
            }
            
            // Check if enableSaveButton function exists
            if (typeof enableSaveButton === 'function') {
                infoHtml += '<div class="success">✅ enableSaveButton function exists</div>';
                // Try to call it
                try {
                    enableSaveButton();
                    infoHtml += '<div class="success">✅ enableSaveButton function called successfully</div>';
                } catch (error) {
                    infoHtml += '<div class="error">❌ Error calling enableSaveButton: ' + error.message + '</div>';
                }
            } else {
                infoHtml += '<div class="error">❌ enableSaveButton function not found</div>';
            }
            
            // Check other button functions
            const functions = ['enableGenerateButton', 'enableSubmitButton', 'disableAllButtons'];
            functions.forEach(func => {
                if (typeof window[func] === 'function') {
                    infoHtml += '<div class="success">✅ ' + func + ' function exists</div>';
                } else {
                    infoHtml += '<div class="error">❌ ' + func + ' function not found</div>';
                }
            });
            
            resultsDiv.innerHTML = infoHtml;
        }

        // Auto-test on page load
        window.onload = function() {
            console.log('Save Button Test Page Loaded');
            
            // Wait a bit for modal to initialize
            setTimeout(() => {
                testSaveButton();
                showModalInfo();
            }, 1000);
        };
    </script>
</body>
</html>
